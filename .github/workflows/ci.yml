name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: backend
      # schema:load, not db:prepare: prepare also runs db:seed on a fresh
      # database, and the specs expect to start with an empty one.
      - run: bin/rails db:schema:load
        env:
          RAILS_ENV: test
      - run: bundle exec rspec
      - run: bundle exec rubocop
      - name: Static security scan
        run: bundle exec brakeman --no-pager -q
      - name: Check gems against known advisories
        run: bundle exec bundler-audit check --update

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check packages against known advisories
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
